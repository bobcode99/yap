openapi: "3.1.0"
info:
  title: yap
  description: |
    On-device speech transcription API powered by Apple Speech.framework.

    Jobs are processed asynchronously — POST returns a job ID immediately,
    then poll GET /transcriptions/{id} until status is `done` or `failed`.
  version: 1.0.0

servers:
  - url: http://127.0.0.1:8080
    description: Local (default)

paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      security: [{}]
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /locales:
    get:
      summary: List supported transcription languages
      operationId: getLocales
      security:
        - {}
        - apiKey: []
      responses:
        "200":
          description: All locales supported by Speech.framework on this machine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /transcriptions:
    post:
      summary: Submit a transcription job
      description: |
        Two input modes:

        **URL mode** — send `application/json` with a `url` field.
        The server downloads the audio file itself.

        **Upload mode** — send raw audio bytes with the appropriate `Content-Type`.
        Pass options as query parameters.
      operationId: createTranscription
      security:
        - {}
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/format"
        - $ref: "#/components/parameters/locale"
        - $ref: "#/components/parameters/censor"
        - $ref: "#/components/parameters/maxLength"
        - $ref: "#/components/parameters/wordTimestamps"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptionRequest"
          audio/mpeg:
            schema:
              type: string
              format: binary
          audio/wav:
            schema:
              type: string
              format: binary
          audio/mp4:
            schema:
              type: string
              format: binary
          video/mp4:
            schema:
              type: string
              format: binary
          audio/ogg:
            schema:
              type: string
              format: binary
          audio/flac:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: Job accepted — poll GET /transcriptions/{id} for result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /transcriptions/{id}:
    get:
      summary: Poll transcription job status
      operationId: getTranscription
      security:
        - {}
        - apiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Pass via --api-key when starting yap serve

  parameters:
    format:
      name: format
      in: query
      description: Output format
      schema:
        type: string
        enum: [txt, srt, vtt, json]
    locale:
      name: locale
      in: query
      description: BCP-47 locale identifier (e.g. en-US, fr-FR, zh-TW)
      schema:
        type: string
    censor:
      name: censor
      in: query
      description: Replace certain words with a redacted form
      schema:
        type: boolean
    maxLength:
      name: max_length
      in: query
      description: Maximum segment length in characters (timed formats only)
      schema:
        type: integer
    wordTimestamps:
      name: word_timestamps
      in: query
      description: Include word-level timestamps (json format only)
      schema:
        type: boolean

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Job not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    LocalesResponse:
      type: object
      required: [locales]
      properties:
        locales:
          type: array
          items:
            $ref: "#/components/schemas/Locale"

    Locale:
      type: object
      required: [id, name, installed]
      properties:
        id:
          type: string
          description: BCP-47 locale identifier
          example: en-US
        name:
          type: string
          description: Localized display name
          example: English (United States)
        installed:
          type: boolean
          description: true means the model is on disk and ready; false means it will download on first use.

    TranscriptionRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: URL of the audio or video file to download and transcribe
          example: https://example.com/audio.mp3
        locale:
          type: string
          example: en-US
        format:
          type: string
          enum: [txt, srt, vtt, json]
        censor:
          type: boolean
        max_length:
          type: integer
        word_timestamps:
          type: boolean

    JobStatus:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [queued, running, done, failed]
        progress:
          type: integer
          minimum: 0
          maximum: 99
          description: Transcription progress percentage (0-99), present when status is running
        format:
          type: string
          enum: [txt, srt, vtt, json]
          description: Present when status is done
        transcript:
          type: string
          description: Present when status is done
        error:
          type: string
          description: Present when status is failed

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
