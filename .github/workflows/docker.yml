name: docker

on:
  push:
    branches: [main, yap-server]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Package.swift"
      - "Package.resolved"
      - "Sources/yap-server/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Package.swift"
      - "Package.resolved"
      - "Sources/yap-server/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [whisper-cpp, faster-whisper, sherpa-onnx, all]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          tags: yap:${{ matrix.target }}
          load: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Smoke test ${{ matrix.target }}
        run: |
          docker run -d --name yap-test -p 8099:8080 yap:${{ matrix.target }}
          for i in {1..15}; do
            if curl -sf http://127.0.0.1:8099/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8099/health
          BACKENDS=$(curl -sf http://127.0.0.1:8099/backends)
          echo "$BACKENDS"
          # apple-speech impossible in Linux container — assert it's absent
          if echo "$BACKENDS" | grep -q apple-speech; then
            echo "ERROR: apple-speech unexpectedly registered"; exit 1
          fi
          docker logs yap-test
          docker rm -f yap-test
