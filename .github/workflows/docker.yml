name: docker

on:
  push:
    branches: [main, yap-server]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Package.swift"
      - "Package.resolved"
      - "Sources/yap-server/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Package.swift"
      - "Package.resolved"
      - "Sources/yap-server/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [whisper-cpp, faster-whisper, sherpa-onnx, all]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          flavor: |
            suffix=-${{ matrix.target }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Smoke test ${{ matrix.target }}
        run: |
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d --name yap-test -p 8099:8080 "$FIRST_TAG"
          for i in {1..15}; do
            if curl -sf http://127.0.0.1:8099/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8099/health
          BACKENDS=$(curl -sf http://127.0.0.1:8099/backends)
          echo "$BACKENDS"
          if echo "$BACKENDS" | grep -q apple-speech; then
            echo "ERROR: apple-speech unexpectedly registered"; exit 1
          fi
          docker logs yap-test
          docker rm -f yap-test

      - name: Push ${{ matrix.target }}
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
